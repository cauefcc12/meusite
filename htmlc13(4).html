<!DOCTYPE>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>formulario simples</title>
    </head>
    <body>

        <h2>entre em contato</h2>
        <form action="/enviar dados"method="POST">
            <!-- campo nome-->
             <label for="name">nome:</label><br>
             <input type="text" id="nome" name="nome" placeholder="seu nome"required><br><br>

             <!--campo e-mail-->
             <label for="e-mail">e-mail:</label><br>
             <input type="e-mail" id="e-mail" name="e-mail" placeholder="seuemail@exemplo"required><br><br>

             <!--área de menssagem-->
             <label for="mensagem">mensagen:</label><br>
             <textarea id="mensagem" name="" rows="4" placeholder="sua mensagem"><br><br>

                <!--botão de envio-->
             <button type="submit">enviar mensagem</button>
             </form>

            </body>
</html>
