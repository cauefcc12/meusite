<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Joguinho simples de adivinha de números</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 50px;
    background-color: white;
}

input {
    padding: 8px;
    width: 100px;
    text-align: center;
}

button {
    padding: 8px 15px;
    font-size: 16px;
    cursor: pointer;
}

.mensagem {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>Adivinhe o número</h1>

<p>Adivinhe um número de 1 a 10!</p>

<input type="number" id="palpite" min="1" max="10">

<button onclick="tentar()">Chutar</button>

<div class="mensagem" id="resultado"></div>

<script>

// Sorteia um número de 1 a 10
let numeroSecreto = Math.floor(Math.random() * 10) + 1;

let tentativas = 3;

function tentar() {

    const chute = Number(document.getElementById('palpite').value);
    const resultado = document.getElementById('resultado');

    if (!chute || chute < 1 || chute > 10) {
        resultado.style.color = 'orange';
        resultado.innerText = 'Digite um número entre 1 e 10!';
        return;
    }

    tentativas--;

    if (chute === numeroSecreto) {

        resultado.style.color = 'green';
        resultado.innerText = 'Parabéns! Você acertou!';
        setTimeout(reiniciar, 3000);

    } else if (tentativas === 0) {

        resultado.style.color = 'red';
        resultado.innerText = `Fim de jogo! O número era ${numeroSecreto}.`;
        setTimeout(reiniciar, 4000);

    } else if (chute < numeroSecreto) {

        resultado.style.color = 'blue';
        resultado.innerText = `Errou! O número secreto é maior. Tentativas restantes: ${tentativas}`;

    } else {

        resultado.style.color = 'blue';
        resultado.innerText = `Errou! O número secreto é menor. Tentativas restantes: ${tentativas}`;

    }
}

// Função para reiniciar o jogo
function reiniciar() {

    numeroSecreto = Math.floor(Math.random() * 10) + 1;

    tentativas = 3;

    document.getElementById('palpite').value = "";
    document.getElementById('resultado').innerText = "";

}

</script>

</body>
</html>
