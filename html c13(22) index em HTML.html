<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Jogo Par ou Ímpar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-container">
<h1>Par ou Ímpar</h1>
<div class="input-group">
<label>Sua Escolha:</label>
<div class="radio-group">
<input type="radio" id="impar" name="opcao" value="impar">
<label for="numero"Seu Número (0 a 5):</label>
<input type="number" id="numero" min="0" max="5" value="0">
</div>
<button id="btn-jogar">Jogar!</button>
<div id="resultado" class="result-box hidden">
<!-- O JavaScript vai preencher o resultado aqui-->
</div>
</div>
<script src="script.js"></script>
</body>
</html>
